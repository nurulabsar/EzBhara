<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>ইজি ভাড়া | EzBhara</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#17231f;background:#f4f7f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#087f5b;color:white;padding:18px max(18px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.35rem;margin:0}header p{margin:3px 0 0;opacity:.9;font-size:.9rem}.wrap{max-width:1060px;margin:auto;padding:20px}.notice{background:#fff5d6;border:1px solid #f0d98a;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.93rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e0e8e3;border-radius:12px;padding:18px;box-shadow:0 2px 8px #18352a0a}h2{font-size:1.1rem;margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:12px}label{display:block;font-size:.9rem;font-weight:600;margin-bottom:5px}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #cbd6cf;border-radius:8px;background:white}button{border:0;border-radius:8px;padding:10px 14px;background:#087f5b;color:#fff;font-weight:650;cursor:pointer}button.secondary{background:#e8f2ed;color:#075b42}button.danger{background:#fff0ed;color:#9e2b1d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f2f8f4;border-radius:9px;padding:12px}.stat small{display:block;color:#54645b}.stat strong{font-size:1.2rem}.muted{color:#5d6a63}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7ece8;white-space:nowrap}th{color:#526158}.full{grid-column:1/-1}.receipt{border:1px dashed #82948a;padding:14px;border-radius:8px;margin-top:12px}.hidden{display:none}.right{text-align:right}.small{font-size:.84rem}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#e8f2ed;color:#075b42;font-size:.82rem}footer{max-width:1060px;margin:0 auto;padding:0 20px 24px;color:#536159;font-size:.85rem}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:14px}.summary{grid-template-columns:1fr 1fr}header{padding:14px 16px}}@media print{header,.notice,.no-print,footer{display:none!important}body{background:white}.wrap{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0}.grid{display:block}.grid>.card:not(#receiptCard){display:none}#receiptCard{display:block!important}.receipt{border:0}.receipt h2{font-size:1.4rem}}
  </style>
</head>
<body>
<header><div><h1>ইজি ভাড়া <span class="small">| EzBhara</span></h1><p id="subtitle">বাড়ি ভাড়া ও মাসিক হিসাবের নমুনা</p></div><button id="languageBtn" class="secondary" type="button">English</button></header>
<main class="wrap">
  <div class="notice" id="privacyNotice"></div>
  <div class="grid">
    <section class="card">
      <h2 id="billingTitle"></h2>
      <div class="row">
        <div class="field"><label id="unitLabel" for="unit"></label><select id="unit"><option>501</option><option>502</option><option>503</option><option>504</option><option>401</option><option>402</option><option>403</option><option>201</option><option>202</option><option>203</option><option>Ground</option></select></div>
        <div class="field"><label id="monthLabel" for="month"></label><input id="month" type="month"></div>
      </div>
      <div class="row">
        <div class="field"><label id="rentLabel" for="rent"></label><input id="rent" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label id="waterLabel" for="water"></label><input id="water" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label id="gasLabel" for="gas"></label><input id="gas" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label id="electricLabel" for="electric"></label><input id="electric" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label id="otherLabel" for="other"></label><input id="other" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label id="otherNoteLabel" for="otherNote"></label><input id="otherNote" type="text" maxlength="80"></div>
      </div>
      <div class="summary"><div class="stat"><small id="totalLabel"></small><strong id="total">৳0</strong></div><div class="stat"><small id="paidLabel"></small><strong id="paid">৳0</strong></div><div class="stat"><small id="dueLabel"></small><strong id="due">৳0</strong></div></div>
      <div class="actions no-print"><button id="saveBill" type="button"></button><button id="clearForm" class="secondary" type="button"></button></div>
    </section>
    <section class="card">
      <h2 id="paymentTitle"></h2>
      <div class="field"><label id="amountLabel" for="amount"></label><input id="amount" type="number" min="1" step="1" value="0"></div>
      <div class="row"><div class="field"><label id="dateLabel" for="paymentDate"></label><input id="paymentDate" type="date"></div><div class="field"><label id="receivedByLabel" for="receivedBy"></label><input id="receivedBy" type="text"></div></div>
      <div class="field"><label id="noteLabel" for="paymentNote"></label><input id="paymentNote" type="text" maxlength="100"></div>
      <div class="actions no-print"><button id="recordPayment" type="button"></button><button id="printReceipt" class="secondary" type="button"></button></div>
      <p class="muted small" id="cashHelp"></p>
    </section>
    <section class="card full">
      <h2 id="historyTitle"></h2><div class="table-wrap"><table><thead><tr><th id="hMonth"></th><th id="hUnit"></th><th id="hTotal"></th><th id="hPaid"></th><th id="hDue"></th><th id="hStatus"></th></tr></thead><tbody id="historyBody"></tbody></table></div>
    </section>
    <section class="card full hidden" id="receiptCard"><h2 id="receiptTitle"></h2><div id="receiptContent" class="receipt"></div></section>
  </div>
</main>
<footer id="footerText"></footer>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const translations = {
    bn:{subtitle:'বাড়ি ভাড়া ও মাসিক হিসাবের নমুনা',privacy:'প্রোটোটাইপ সতর্কতা: এটি শুধু পরীক্ষা করার জন্য। এখানে বাস্তব ভাড়াটিয়ার নাম, NID/পাসপোর্ট, ছবি, যোগাযোগের তথ্য বা অর্থের রেকর্ড দেবেন না। এই সংস্করণে নিরাপদ লগইন বা অনলাইন ব্যাকএন্ড নেই; তথ্য শুধু এই ব্রাউজারে থাকে।',billingTitle:'মাসিক বিল',unitLabel:'ফ্ল্যাট/ইউনিট নম্বর',monthLabel:'বিলের মাস',rentLabel:'মাসিক ভাড়া (৳)',waterLabel:'পানির বিল (৳)',gasLabel:'গ্যাস চার্জ (৳)',electricLabel:'বিদ্যুৎ বিল (৳)',otherLabel:'পরিষ্কার/মেরামত/অন্যান্য (৳)',otherNoteLabel:'অন্য চার্জের বিবরণ',totalLabel:'মোট বিল',paidLabel:'পরিশোধিত',dueLabel:'বাকি',saveBill:'বিল সংরক্ষণ',clearForm:'ফর্ম খালি করুন',paymentTitle:'নগদ পেমেন্ট',amountLabel:'এখন পাওয়া টাকা (৳)',dateLabel:'টাকা পাওয়ার তারিখ',receivedByLabel:'টাকা গ্রহণ করেছেন',noteLabel:'নোট (ঐচ্ছিক)',recordPayment:'নগদ পেমেন্ট গ্রহণ নিশ্চিত করুন',printReceipt:'রসিদ দেখুন / প্রিন্ট',cashHelp:'শুধু মালিক/অ্যাডমিন নগদ পেমেন্ট গ্রহণ নিশ্চিত করবেন। আংশিক পেমেন্টও রেকর্ড করা যাবে।',historyTitle:'সংরক্ষিত বিলের ইতিহাস (এই ব্রাউজারে)',hMonth:'মাস',hUnit:'ইউনিট',hTotal:'মোট',hPaid:'পরিশোধিত',hDue:'বাকি',hStatus:'অবস্থা',statusPaid:'পরিশোধিত',statusPart:'আংশিক পরিশোধ',statusDue:'বাকি',receiptTitle:'পেমেন্ট রসিদ',receipt:'রসিদ',tenant:'ভাড়াটিয়া / ইউনিট',billMonth:'বিলের মাস',received:'গ্রহণ করা হয়েছে',date:'তারিখ',method:'পেমেন্ট পদ্ধতি',cash:'নগদ',balance:'অবশিষ্ট বাকি',receivedBy:'গ্রহণ করেছেন',note:'নোট',saved:'বিল সংরক্ষিত হয়েছে।',needBill:'আগে বিল সংরক্ষণ করুন।',needAmount:'পেমেন্টের পরিমাণ ০-এর বেশি হতে হবে।',overpay:'পেমেন্টের পরিমাণ বাকি বিলের চেয়ে বেশি।',paymentSaved:'নগদ পেমেন্ট রেকর্ড হয়েছে।',selectRecord:'রসিদ দেখার জন্য ইতিহাস থেকে একটি বিল বাছুন অথবা পেমেন্ট রেকর্ড করুন।',footer:'EzBhara প্রোটোটাইপ। বাস্তব ব্যবহারের আগে নিরাপদ সার্ভার, লগইন, অনুমতি, ব্যাকআপ এবং ব্যক্তিগত তথ্য সুরক্ষা যোগ করা প্রয়োজন।',deleteConfirm:'এই ব্রাউজারের সব প্রোটোটাইপ ডেটা মুছে ফেলবেন?'} ,
    en:{subtitle:'Rental and monthly billing prototype',privacy:'Prototype warning: for testing only. Do not enter real tenant names, NID/passport numbers, photos, contact details, or financial records. This version has no secure login or online backend; data stays only in this browser.',billingTitle:'Monthly bill',unitLabel:'Flat/unit number',monthLabel:'Billing month',rentLabel:'Monthly rent (৳)',waterLabel:'Water bill (৳)',gasLabel:'Gas charge (৳)',electricLabel:'Electricity bill (৳)',otherLabel:'Cleaning/maintenance/other (৳)',otherNoteLabel:'Other charge description',totalLabel:'Total bill',paidLabel:'Paid',dueLabel:'Due',saveBill:'Save bill',clearForm:'Clear form',paymentTitle:'Cash payment',amountLabel:'Amount received now (৳)',dateLabel:'Received date',receivedByLabel:'Received by',noteLabel:'Note (optional)',recordPayment:'Confirm cash received',printReceipt:'View / print receipt',cashHelp:'Only the owner/admin confirms cash received. Partial payments can also be recorded.',historyTitle:'Saved bill history (this browser)',hMonth:'Month',hUnit:'Unit',hTotal:'Total',hPaid:'Paid',hDue:'Due',hStatus:'Status',statusPaid:'Paid',statusPart:'Partially paid',statusDue:'Due',receiptTitle:'Payment receipt',receipt:'Receipt',tenant:'Tenant / unit',billMonth:'Billing month',received:'Amount received',date:'Date',method:'Payment method',cash:'Cash',balance:'Remaining due',receivedBy:'Received by',note:'Note',saved:'Bill saved.',needBill:'Save the bill first.',needAmount:'Payment amount must be greater than zero.',overpay:'Payment amount exceeds the remaining bill.',paymentSaved:'Cash payment recorded.',selectRecord:'Select a bill from history or record a payment to view a receipt.',footer:'EzBhara prototype. Before real use, secure hosting, authentication, permissions, backups, and personal-data protection are required.',deleteConfirm:'Delete all prototype data in this browser?'}
  };
  let lang=localStorage.getItem('ezbhara_lang')||'bn';let selectedReceipt=null;
  const keys=['subtitle','privacyNotice','billingTitle','unitLabel','monthLabel','rentLabel','waterLabel','gasLabel','electricLabel','otherLabel','otherNoteLabel','totalLabel','paidLabel','dueLabel','saveBill','clearForm','paymentTitle','amountLabel','dateLabel','receivedByLabel','noteLabel','recordPayment','printReceipt','cashHelp','historyTitle','hMonth','hUnit','hTotal','hPaid','hDue','hStatus','receiptTitle','footerText'];
  function t(k){return translations[lang][k]||k}function money(v){return '৳'+Number(v||0).toLocaleString(lang==='bn'?'bn-BD':'en-US')}
  function setText(){const m={subtitle:'subtitle',privacyNotice:'privacy',billingTitle:'billingTitle',unitLabel:'unitLabel',monthLabel:'monthLabel',rentLabel:'rentLabel',waterLabel:'waterLabel',gasLabel:'gasLabel',electricLabel:'electricLabel',otherLabel:'otherLabel',otherNoteLabel:'otherNoteLabel',totalLabel:'totalLabel',paidLabel:'paidLabel',dueLabel:'dueLabel',saveBill:'saveBill',clearForm:'clearForm',paymentTitle:'paymentTitle',amountLabel:'amountLabel',dateLabel:'dateLabel',receivedByLabel:'receivedByLabel',noteLabel:'noteLabel',recordPayment:'recordPayment',printReceipt:'printReceipt',cashHelp:'cashHelp',historyTitle:'historyTitle',hMonth:'hMonth',hUnit:'hUnit',hTotal:'hTotal',hPaid:'hPaid',hDue:'hDue',hStatus:'hStatus',receiptTitle:'receiptTitle',footerText:'footer'};Object.entries(m).forEach(([id,k])=>$(id).textContent=t(k));$('languageBtn').textContent=lang==='bn'?'English':'বাংলা';document.documentElement.lang=lang;renderHistory();updateSummary();}
  function getRecords(){try{return JSON.parse(localStorage.getItem('ezbhara_bills')||'{}')}catch{return {}}}function setRecords(x){localStorage.setItem('ezbhara_bills',JSON.stringify(x))}function key(){return $('unit').value+'|'+$('month').value}function nums(){return ['rent','water','gas','electric','other'].reduce((o,id)=>(o[id]=Number($(id).value)||0,o),{})}function total(b){return ['rent','water','gas','electric','other'].reduce((s,k)=>s+(Number(b[k])||0),0)}function paid(b){return (b.payments||[]).reduce((s,p)=>s+Number(p.amount||0),0)}
  function loadBill(){const b=getRecords()[key()];['rent','water','gas','electric','other'].forEach(id=>$(id).value=b?b[id]||0:0);$('otherNote').value=b?.otherNote||'';$('amount').value=0;updateSummary()}
  function current(){const r=getRecords()[key()];return r||null}
  function updateSummary(){const b=current()||{...nums(),payments:[]};const sum=total(b),p=paid(b);$('total').textContent=money(sum);$('paid').textContent=money(p);$('due').textContent=money(Math.max(0,sum-p))}
  function saveBill(){const records=getRecords(),old=records[key()]||{payments:[]};Object.assign(old,nums(),{unit:$('unit').value,month:$('month').value,otherNote:$('otherNote').value});records[key()]=old;setRecords(records);updateSummary();renderHistory();alert(t('saved'))}
  function status(b){const d=total(b)-paid(b);return d<=0?t('statusPaid'):paid(b)>0?t('statusPart'):t('statusDue')}
  function renderHistory(){const body=$('historyBody');if(!body)return;body.innerHTML='';Object.entries(getRecords()).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,b])=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${esc(b.month||k.split('|')[1])}</td><td>${esc(b.unit||k.split('|')[0])}</td><td>${money(total(b))}</td><td>${money(paid(b))}</td><td>${money(Math.max(0,total(b)-paid(b)))}</td><td><button class="secondary small" type="button">${esc(status(b))}</button></td>`;tr.querySelector('button').onclick=()=>{const [u,m]=k.split('|');$('unit').value=u;$('month').value=m;loadBill();selectedReceipt={key:k,bill:b};$('receiptCard').classList.remove('hidden')};body.appendChild(tr)});if(!body.children.length){const tr=document.createElement('tr');tr.innerHTML=`<td colspan="6" class="muted">—</td>`;body.appendChild(tr)}}
  function recordPayment(){const records=getRecords(),b=records[key()];if(!b){alert(t('needBill'));return}const amount=Number($('amount').value)||0;if(amount<=0){alert(t('needAmount'));return}const due=Math.max(0,total(b)-paid(b));if(amount>due){alert(t('overpay'));return}const p={amount,date:$('paymentDate').value,receivedBy:$('receivedBy').value,note:$('paymentNote').value,receiptNo:'EZ-'+Date.now().toString().slice(-8)};b.payments=b.payments||[];b.payments.push(p);records[key()]=b;setRecords(records);selectedReceipt={key:key(),bill:b,payment:p};updateSummary();renderHistory();renderReceipt();alert(t('paymentSaved'))}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function renderReceipt(){if(!selectedReceipt){alert(t('selectRecord'));return}const b=selectedReceipt.bill,p=selectedReceipt.payment||(b.payments||[]).slice(-1)[0]||{};$('receiptContent').innerHTML=`<h3>ইজি ভাড়া | EzBhara</h3><p><strong>${esc(t('receipt'))}:</strong> ${esc(p.receiptNo||'—')}</p><p><strong>${esc(t('tenant'))}:</strong> ${esc(b.unit||'')} &nbsp; <strong>${esc(t('billMonth'))}:</strong> ${esc(b.month||'')}</p><p>${esc(t('rentLabel'))}: ${money(b.rent)} | ${esc(t('waterLabel'))}: ${money(b.water)} | ${esc(t('gasLabel'))}: ${money(b.gas)} | ${esc(t('electricLabel'))}: ${money(b.electric)} | ${esc(t('otherLabel'))}: ${money(b.other)}</p><p><strong>${esc(t('totalLabel'))}:</strong> ${money(total(b))}</p><p><strong>${esc(t('received'))}:</strong> ${money(p.amount)} &nbsp; <strong>${esc(t('date'))}:</strong> ${esc(p.date||'')}</p><p><strong>${esc(t('method'))}:</strong> ${esc(t('cash'))} &nbsp; <strong>${esc(t('balance'))}:</strong> ${money(Math.max(0,total(b)-paid(b)))}</p><p><strong>${esc(t('receivedBy'))}:</strong> ${esc(p.receivedBy||'—')}</p>${p.note?`<p><strong>${esc(t('note'))}:</strong> ${esc(p.note)}</p>`:''}`;$('receiptCard').classList.remove('hidden')}
  $('languageBtn').onclick=()=>{lang=lang==='bn'?'en':'bn';localStorage.setItem('ezbhara_lang',lang);setText()};$('unit').onchange=loadBill;$('month').onchange=loadBill;$['rent','water','gas','electric','other'].forEach(id=>$(id).oninput=updateSummary);$('saveBill').onclick=saveBill;$('recordPayment').onclick=recordPayment;$('printReceipt').onclick=()=>{if(!selectedReceipt){const b=current();if(b)selectedReceipt={key:key(),bill:b};}renderReceipt();window.print()};$('clearForm').onclick=()=>{['rent','water','gas','electric','other'].forEach(id=>$(id).value=0);$('otherNote').value='';$('amount').value=0;updateSummary()};
  const now=new Date();$('month').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;$('paymentDate').value=new Date().toISOString().slice(0,10);$('languageBtn').title='Change language';setText();loadBill();
})();
</script>
</body>
</html>
